---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-runner-scale-set
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # yamllint disable rule:line-length
    githubConfigUrl: https://github.com/kalimet # org URL - runners see every repo kalimet-ci is installed on
    # yamllint enable rule:line-length
    githubConfigSecret: gha-runner-scale-set-github-app
    runnerScaleSetName: home-ops-runners
    minRunners: 0
    # one per eligible node (node1, node2; see topology spread). #425 capped
    # this at 1 because a 250m cpu request did not fit node2 (~220m free);
    # the pod-level request below is 100m
    maxRunners: 2
    containerMode:
      type: dind
    template:
      spec:
        # pod-level resources (PodLevelResources, beta + on since 1.34) cap
        # runner AND the dind sidecar together: the dind preset gives dind no
        # resources, so docker builds were unbounded. requests = limits for
        # memory so the scheduler accounts for the real footprint: 6 runners
        # x 2Gi limits once put nodes at 170% of their 8GB and OOMed them.
        # 3Gi: web's vite build runs with a 2GB heap inside dind, and
        # type-aware oxlint needs ~2GB. cpu stays capped at 1 of the 2 cores
        # (#369) so k3s/etcd on these control-plane nodes keep one.
        resources:
          requests:
            cpu: 100m
            memory: 3Gi
          limits:
            cpu: 1
            memory: 3Gi
        # prometheus is pinned to node0 with a node-local PVC and a 3Gi limit.
        # keep builds off it so a compile cannot OOM the metrics stack.
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values: ["node0-a55d689e"]
        # 4 runners packed on node1 (13 cc1plus, 3.7GB) OOMed the host; spread
        # them (3Gi requests fit only one per node anyway)
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: runner
                actions.github.com/scale-set-name: home-ops-runners
        containers:
          - name: runner
            # required: helm replaces this list entry wholesale, so the
            # chart's dind-preset command is dropped if not repeated here
            command: ["/home/runner/run.sh"]
            image: ghcr.io/actions/actions-runner:2.338.0
