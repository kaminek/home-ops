---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-runner-scale-set
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # yamllint disable rule:line-length
    githubConfigUrl: https://github.com/kalimet # org URL - runners see every repo kalimet-ci is installed on
    # yamllint enable rule:line-length
    githubConfigSecret: gha-runner-scale-set-github-app
    runnerScaleSetName: home-ops-runners
    minRunners: 0
    maxRunners: 3
    containerMode:
      type: dind
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.337.0
            resources:
              requests:
                cpu: 250m
                memory: 256Mi
              limits:
                cpu: 1500m
                memory: 2Gi
