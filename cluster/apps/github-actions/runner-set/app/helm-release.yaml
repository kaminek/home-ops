---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-runner-scale-set
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # yamllint disable rule:line-length
    githubConfigUrl: https://github.com/kalimet # org URL - runners see every repo kalimet-ci is installed on
    # yamllint enable rule:line-length
    githubConfigSecret: gha-runner-scale-set-github-app
    runnerScaleSetName: home-ops-runners
    minRunners: 0
    maxRunners: 4
    containerMode:
      type: dind
    template:
      spec:
        # prometheus is pinned to node0 with a node-local PVC and a 3Gi limit.
        # keep builds off it so a compile cannot OOM the metrics stack.
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values: ["node0-a55d689e"]
        # 4 runners packed on node1 (13 cc1plus, 3.7GB) OOMed the host; max 2
        # per eligible node
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: runner
                actions.github.com/scale-set-name: home-ops-runners
        containers:
          - name: runner
            # required: helm replaces this list entry wholesale, so the
            # chart's dind-preset command is dropped if not repeated here
            command: ["/home/runner/run.sh"]
            image: ghcr.io/actions/actions-runner:2.337.0
            resources:
              requests:
                cpu: 250m
                # requests reserve; limits are what the kernel OOM killer acts
                # on. 6 runners x 2Gi put node memory limits at 170% of the 8GB
                # physical, so cc1plus builds OOMed the host and took kubelet
                # with them, flapping nodes NotReady. request = limit so the
                # scheduler accounts for the real footprint.
                memory: 1Gi
              limits:
                cpu: 1
                memory: 1Gi
