---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: affine
  namespace: database
spec:
  name: affine
  owner: affine
  cluster:
    name: main
  databaseReclaimPolicy: retain
  # affine migrations run CREATE EXTENSION IF NOT EXISTS, vector needs superuser
  extensions:
    - name: vector
    - name: pgcrypto
