---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/referencegrant_v1.json
# lets HTTPRoute ExternalAuth filters in other namespaces use oauth2-proxy
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: oauth2-proxy
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kube-system
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: observability
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: utilities
  to:
    - group: ""
      kind: Service
      name: oauth2-proxy
    - group: ""
      kind: Service
      name: oauth2-proxy-kalimet
