---
# Generated by cilium for the Gateway; only nodePort is ours. The api has no
# field for it and the operator keeps what is set here.
apiVersion: v1
kind: Service
metadata:
  name: cilium-gateway-external
spec:
  type: NodePort
  ports:
    - name: port-8443
      port: 8443
      targetPort: 8443
      protocol: TCP
      nodePort: 443
