---
# Generated by cilium for the Gateway; nodePort and externalTrafficPolicy are
# ours (no gateway api field; operator ignores gatewayAPI.externalTrafficPolicy
# in hostNetwork mode) and the operator keeps what is set here.
apiVersion: v1
kind: Service
metadata:
  name: cilium-gateway-external
spec:
  type: NodePort
  # keep client source ip; envoy runs on every node
  externalTrafficPolicy: Local
  ports:
    - name: port-8443
      port: 8443
      targetPort: 8443
      protocol: TCP
      nodePort: 443
