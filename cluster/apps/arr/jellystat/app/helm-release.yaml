---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jellystat
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      jellystat:
        containers:
          app:
            image:
              repository: ghcr.io/cyfershepard/jellystat
              tag: 1.1.12
            env:
              TZ: Europe/London
              POSTGRES_IP: main-rw.database.svc.cluster.local
              POSTGRES_PORT: "5432"
              POSTGRES_DB: jellystat
              POSTGRES_USER: jellystat
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: arr-secrets
                    key: JELLYSTAT_DB_PASSWORD
              JWT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: arr-secrets
                    key: JELLYSTAT_JWT_SECRET
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: jellystat
        ports:
          http:
            port: 3000
    ingress:
      app:
        className: external
        annotations:
          external-dns.alpha.kubernetes.io/hostname: jellystat.kaminek.me
          cert-manager.io/cluster-issuer: letsencrypt-production
          nginx.ingress.kubernetes.io/auth-url: "https://oauth.kaminek.me/oauth2/auth"
          nginx.ingress.kubernetes.io/auth-signin: "https://oauth.kaminek.me/oauth2/start?rd=$scheme://$host$request_uri"
          hajimari.io/enable: "true"
          hajimari.io/icon: chart-line
          hajimari.io/group: Media
        hosts:
          - host: &host jellystat.kaminek.me
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
            secretName: jellystat-tls
    persistence:
      backup:
        type: emptyDir
        globalMounts:
          - path: /app/backend/backup-data
