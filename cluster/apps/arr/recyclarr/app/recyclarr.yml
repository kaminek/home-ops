---
# TRaSH guide-backed profiles: qualities, custom formats and scores come from the guide.
# Browse more: `recyclarr list quality-profiles sonarr|radarr`
sonarr:
  sonarr:
    base_url: http://sonarr.arr.svc.cluster.local:8989
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true
    quality_definition:
      type: series
    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        reset_unmatched_scores:
          enabled: true

radarr:
  radarr:
    base_url: http://radarr.arr.svc.cluster.local:7878
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true
    quality_definition:
      type: movie
    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
