---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webhook-receiver
  annotations:
    gatus.home-operations.com/enabled: "false" # superseded by notification-controller-healthz service check
spec:
  hostnames: ["flux-webhook.kaminek.me"]
  parentRefs:
    - name: external
      namespace: networking
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hook/
      backendRefs:
        - name: webhook-receiver
          port: 80
