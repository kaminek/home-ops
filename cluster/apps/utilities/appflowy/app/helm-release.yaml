---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: appflowy
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: ./helm/appflowy-cloud
      # chart version never changes upstream, re-render on every source commit
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: appflowy-selfhost
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  valuesFrom:
    - kind: Secret
      name: appflowy-secret
      valuesKey: admin-password
      targetPath: gotrue.config.adminPassword
    - kind: Secret
      name: appflowy-secret
      valuesKey: google-client-id
      targetPath: gotrue.config.oauth.google.clientId
    - kind: Secret
      name: appflowy-secret
      valuesKey: google-client-secret
      targetPath: gotrue.config.oauth.google.secret
  values:
    fullnameOverride: appflowy
    global:
      domain: doc.kaminek.me
      scheme: https
      wsScheme: wss
      postgresql:
        host: main-rw.database.svc.cluster.local
        database: appflowy
        username: appflowy
        existingSecret: appflowy-secret
      jwt:
        existingSecret: appflowy-secret
      s3:
        existingSecret: appflowy-secret
        presignedUrlEndpoint: https://doc.kaminek.me/minio-api
    # CNPG main cluster instead (cloudnative-pg/cluster/appflowy-database.yaml)
    postgresql:
      enabled: false
    redis:
      master:
        persistence:
          storageClass: openebs-hostpath
          size: 1Gi
    minio:
      auth:
        existingSecret: appflowy-secret
      persistence:
        # ponytail: node-local disk, no replication or backup for uploads; move to R2 if attachments matter
        storageClass: openebs-hostpath
        size: 20Gi
    gotrue:
      image:
        tag: 0.18.11
      config:
        adminEmail: kaminek92@gmail.com
        # signup stays open at gotrue level so the whitelist (managed in /console) can gate it
        disableSignup: false
        oauth:
          google:
            enabled: true
    appflowy-cloud:
      image:
        tag: 0.20.0
      config:
        signupWhitelistEnabled: true
    appflowy-worker:
      image:
        tag: 0.20.0
    appflowy-search:
      image:
        tag: 0.20.0
      persistence:
        storageClass: openebs-hostpath
      config:
        # semantic indexing needs the AI service
        backgroundIndexerEnabled: false
    appflowy-web:
      image:
        tag: 0.19.30
    admin-frontend:
      image:
        tag: 0.19.3
    appflowy-ai:
      enabled: false
    ingress:
      className: external
      certManager:
        issuerName: letsencrypt-production
      scim:
        enabled: false
    # chart policy blocks egress to the database namespace
    networkPolicy:
      enabled: false
