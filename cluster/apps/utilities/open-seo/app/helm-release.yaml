---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app open-seo
spec:
  releaseName: *app
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      open-seo:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # ponytail: ghcr semver tags stop at v0.0.21 (stale); pin latest by digest
              repository: ghcr.io/every-app/open-seo
              tag: latest@sha256:61f8424f9ed5cad74957030d983d055d363cc5e916d874c6b2e29f336f5dcd35
            env:
              TZ: Europe/Paris
              PORT: "3001"
              ALLOWED_HOST: &host seo.kaminek.me
              # app auth off; oauth2-proxy on the ingress guards it
              AUTH_MODE: local_noauth
              CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
              OPENSEO_TELEMETRY_DISABLED: "1"
              VITE_SHOW_DEVTOOLS: "false"
            envFrom:
              - secretRef:
                  name: open-seo-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 3001
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  # vite build runs on every container start (~minutes on 2 cores)
                  periodSeconds: 10
                  failureThreshold: 90
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                # build sets --max-old-space-size=4096
                memory: 5Gi
    service:
      app:
        controller: open-seo
        ports:
          http:
            port: *port
    ingress:
      main:
        enabled: true
        className: external
        annotations:
          external-dns.alpha.kubernetes.io/hostname: *host
          cert-manager.io/cluster-issuer: letsencrypt-production
          nginx.ingress.kubernetes.io/auth-url: "https://oauth.kaminek.me/oauth2/auth"
          nginx.ingress.kubernetes.io/auth-signin: "https://oauth.kaminek.me/oauth2/start?rd=$scheme://$host$request_uri"
          hajimari.io/enable: "true"
          hajimari.io/icon: magnify
          hajimari.io/group: Utilities
          hajimari.io/appName: OpenSEO
        hosts:
          - host: *host
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
            secretName: open-seo-tls
    persistence:
      data:
        existingClaim: open-seo-data
        globalMounts:
          - path: /app/.wrangler
