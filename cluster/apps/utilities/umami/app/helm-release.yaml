---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: umami
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      main:
        pod:
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
        containers:
          main:
            image:
              repository: ghcr.io/umami-software/umami
              tag: 3.5.0
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: umami-secret
                    key: DATABASE_URL
              APP_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: umami-secret
                    key: APP_SECRET
              DISABLE_TELEMETRY: "1"
              # real client ip for geo, set by envoy from the TCP peer
              CLIENT_IP_HEADER: X-Envoy-External-Address
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/heartbeat
                    port: 3000
              readiness: *probe
              # first boot runs prisma migrations before the server listens
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/heartbeat
                    port: 3000
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
    route:
      main:
        annotations:
          gatus.home-operations.com/endpoint: |
            path: /api/heartbeat
        hostnames: ["umami.kaminek.me"]
        parentRefs:
          - name: external
            namespace: networking
        rules:
          # tracker must stay public: visitors load the script and post events unauthenticated
          - matches:
              - path:
                  type: Exact
                  value: /script.js
              - path:
                  type: PathPrefix
                  value: /api/send
              - path:
                  type: Exact
                  value: /api/heartbeat
            backendRefs: &backend
              - identifier: main
                port: http
            filters:
              - &hsts
                type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: Strict-Transport-Security
                      value: max-age=31449600; includeSubDomains
          # dashboard behind oauth2-proxy-kalimet, umami login still applies
          - backendRefs: *backend
            filters:
              - type: ExternalAuth
                externalAuth:
                  protocol: HTTP
                  backendRef:
                    name: oauth2-proxy-kalimet
                    namespace: networking
                    port: 80
                  http:
                    allowedHeaders: ["Cookie"]
                    allowedResponseHeaders: ["X-Auth-Request-Email"]
              - *hsts
