---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: umami
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      main:
        pod:
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
        initContainers:
          # DB-IP City Lite (CC BY 4.0, "IP geolocation by DB-IP"): has cities
          # the bundled GeoLite2 lacks; regions stay empty (no iso codes).
          # ponytail: fetched once per pod start, refreshed only on restart;
          # falls back to bundled GeoLite2 if db-ip is unreachable
          geo:
            image: &image
              repository: ghcr.io/umami-software/umami
              tag: 3.5.0
            command: ["sh", "-c"]
            args:
              - |
                set -u
                cur=$(date +%Y-%m)
                y=$(date +%Y); m=$(date +%m); m=${m#0}
                if [ "$m" -eq 1 ]; then prev="$((y-1))-12"; else prev="$y-$(printf %02d $((m-1)))"; fi
                for v in "$cur" "$prev"; do
                  if wget -q -T 60 -O - "https://download.db-ip.com/free/dbip-city-lite-$v.mmdb.gz" | gunzip > /geo/city.mmdb.tmp && [ -s /geo/city.mmdb.tmp ]; then
                    mv /geo/city.mmdb.tmp /geo/city.mmdb; echo "db-ip $v"; exit 0
                  fi
                done
                echo "db-ip download failed, using bundled GeoLite2"
                cp /app/geo/GeoLite2-City.mmdb /geo/city.mmdb
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
        containers:
          main:
            image: *image
            securityContext: *securityContext
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: umami-secret
                    key: DATABASE_URL
              APP_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: umami-secret
                    key: APP_SECRET
              DISABLE_TELEMETRY: "1"
              # real client ip for geo, set by cloudflare
              CLIENT_IP_HEADER: CF-Connecting-IP
              GEOLITE_DB_PATH: /geo/city.mmdb
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/heartbeat
                    port: 3000
              readiness: *probe
              # first boot runs prisma migrations before the server listens
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/heartbeat
                    port: 3000
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 50m
                memory: 384Mi
              limits:
                # geo db (~120MB) is loaded fully into memory
                memory: 1Gi
    persistence:
      geo:
        type: emptyDir
        sizeLimit: 512Mi
        globalMounts:
          - path: /geo
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
    route:
      main:
        annotations:
          gatus.home-operations.com/endpoint: |
            path: /api/heartbeat
        hostnames: ["umami.kaminek.me"]
        parentRefs:
          - name: external
            namespace: networking
        rules:
          # tracker must stay public: visitors load the script and post events unauthenticated
          - matches:
              - path:
                  type: Exact
                  value: /script.js
              - path:
                  type: PathPrefix
                  value: /api/send
              - path:
                  type: Exact
                  value: /api/heartbeat
            backendRefs: &backend
              - identifier: main
                port: http
            filters:
              - &hsts
                type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: Strict-Transport-Security
                      value: max-age=31449600; includeSubDomains
          # dashboard behind oauth2-proxy-kalimet, umami login still applies
          - backendRefs: *backend
            filters:
              - type: ExternalAuth
                externalAuth:
                  protocol: HTTP
                  backendRef:
                    name: oauth2-proxy-kalimet
                    namespace: networking
                    port: 80
                  http:
                    allowedHeaders: ["Cookie"]
                    allowedResponseHeaders: ["X-Auth-Request-Email"]
              - *hsts
