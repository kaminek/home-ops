---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      main:
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          affinity:
            podAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        cnpg.io/cluster: main
                        cnpg.io/instanceRole: primary
                    topologyKey: kubernetes.io/hostname
                    namespaces:
                      - database
        containers:
          main:
            image:
              repository: vaultwarden/server
              tag: 1.37.5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: vaultwarden-secret
                    key: DATABASE_URL
              # argon2 hash; /admin is also behind oauth2-proxy
              ADMIN_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: vaultwarden-secret
                    key: ADMIN_TOKEN
              DOMAIN: https://vaultwarden.kaminek.me
              # Hardening options
              SIGNUPS_ALLOWED: "false"
              # org admins can invite users while signups stay closed
              INVITATIONS_ALLOWED: "true"
              PASSWORD_HINTS_ALLOWED: "false"
              SHOW_PASSWORD_HINT: "false"
              LOGIN_RATELIMIT_SECONDS: "60"
              LOGIN_RATELIMIT_MAX_BURST: "5"
              DISABLE_ICON_DOWNLOAD: "true"
              # set by envoy from the TCP peer; XFF and X-Real-IP pass through client-controlled
              IP_HEADER: X-Envoy-External-Address
              ORG_CREATION_USERS: kaminek92@gmail.com
              INCOMPLETE_2FA_TIME_LIMIT: "3"
              SENDS_ALLOWED: "true"
              LOG_LEVEL: warn
              EXTENDED_LOGGING: "true"
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 256Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
    route:
      main:
        annotations:
          gatus.home-operations.com/endpoint: |
            path: /alive
        hostnames: ["vaultwarden.kaminek.me"]
        parentRefs:
          - name: external
            namespace: networking
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /admin
            backendRefs: &backend
              - identifier: main
                port: http
            filters:
              - type: ExternalAuth
                externalAuth:
                  protocol: HTTP
                  backendRef:
                    name: oauth2-proxy
                    namespace: networking
                    port: 80
                  http:
                    allowedHeaders: ["Cookie"]
                    allowedResponseHeaders: ["X-Auth-Request-Email"]
              - &hsts
                type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: Strict-Transport-Security
                      value: max-age=31449600; includeSubDomains
            timeouts: &timeouts
              request: 0s # envoy default is 15s
          - backendRefs: *backend
            filters:
              - *hsts
            timeouts: *timeouts
      # single DOMAIN upstream: passkeys/2FA break on other hostnames
      legacy:
        hostnames: ["bitwarden.kaminek.me"]
        parentRefs:
          - name: external
            namespace: networking
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  hostname: vaultwarden.kaminek.me
                  statusCode: 301
    persistence:
      data:
        existingClaim: vaultwarden-data
        globalMounts:
          - path: /data
