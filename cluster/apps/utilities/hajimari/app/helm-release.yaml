---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hajimari
spec:
  interval: 30m
  chart:
    spec:
      chart: hajimari
      version: 2.0.2
      sourceRef:
        kind: HelmRepository
        name: hajimari
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    image:
      repository: ghcr.io/toboshii/hajimari
      tag: v0.3.1
    podSecurityContext:
      fsGroup: 101
    hajimari:
      name: Kaminek
      title: Hajimari
      lightTheme: paper
      darkTheme: espresso
      customThemes: []
      showSearch: true
      showGreeting: true
      showApps: true
      showAppGroups: true
      showAppUrls: false
      showAppInfo: false
      showAppStatus: true
      defaultAppIcon: mdi:application
      showBookmarks: true
      showGlobalBookmarks: true
      showBookmarkGroups: true
      alwaysTargetBlank: false
      defaultEnable: false
      namespaceSelector:
        any: true
      # hajimari only discovers Ingresses, apps behind the gateway are listed here
      customApps:
        - group: Monitoring
          apps:
            - {name: Alertmanager, url: https://alertmanager.kaminek.me, icon: mdi:bell-alert}
            - {name: Gatus, url: https://gatus.kaminek.me, icon: mdi:list-status}
            - {name: Grafana, url: https://grafana.kaminek.me, icon: mdi:chart-areaspline}
            - {name: Prometheus, url: https://prometheus.kaminek.me, icon: mdi:database-search}
            - {name: SmokePing, url: https://ping.kaminek.me, icon: mdi:lan-pending}
        - group: Network
          apps:
            - {name: AdGuard, url: https://adguard.kaminek.me, icon: mdi:shield-check}
            - {name: Hubble, url: https://hubble.kaminek.me, icon: mdi:lan}
        - group: Security
          apps:
            - {name: Vaultwarden, url: https://vaultwarden.kaminek.me, icon: mdi:shield-key}
        - group: Utilities
          apps:
            - {name: AFFiNE, url: https://doc.kaminek.me, icon: mdi:notebook}
            - {name: Glance, url: https://glance.kaminek.me, icon: mdi:view-dashboard}
            - {name: Umami, url: https://umami.kaminek.me, icon: mdi:chart-line}
      groups:
        - name: Cloud
          links:
            - name: GitHub
              url: https://github.com
            - name: Cloudflare
              url: https://dash.cloudflare.com
        - name: Media
          links:
            - name: YouTube
              url: https://youtube.com
            - name: Spotify
              url: https://open.spotify.com
      searchProviders:
        - name: Google
          token: g
          icon: simple-icons:google
          searchUrl: https://www.google.com/search?q={query}
          url: https://www.google.com
    service:
      main:
        ports:
          http:
            port: 3000
    persistence:
      data:
        enabled: true
        storageClass: openebs-hostpath
        size: 100Mi
        accessMode: ReadWriteOnce
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
