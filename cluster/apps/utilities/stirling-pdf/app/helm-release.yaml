---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app stirling-pdf
spec:
  releaseName: *app
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      stirling-pdf:
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/stirling-tools/stirling-pdf
              tag: 3.4.0

            env:
              TZ: Europe/Paris
              DOCKER_ENABLE_SECURITY: "false"
              SECURITY_ENABLE_LOGIN: "false"
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: stirling-pdf
        ports:
          http:
            port: 8080
    route:
      main:
        hostnames: ["pdf.kaminek.me"]
        parentRefs:
          - name: external
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: http
            filters:
              - type: ExternalAuth
                externalAuth:
                  protocol: HTTP
                  backendRef:
                    name: oauth2-proxy
                    namespace: networking
                    port: 80
                  http:
                    allowedHeaders: ["Cookie"]
                    allowedResponseHeaders: ["X-Auth-Request-Email"]
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: Strict-Transport-Security
                      value: max-age=31449600; includeSubDomains
            timeouts:
              request: 0s # envoy default is 15s
