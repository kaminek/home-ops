---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: affine
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      main:
        # single writer on the RWO volume and the db migrations
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          migrate:
            image: &image
              repository: ghcr.io/toeverything/affine
              tag: 0.27.4
            command: ["node", "./scripts/self-host-predeploy.js"]
            env: &env
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: affine-secret
                    key: DATABASE_URL
              REDIS_SERVER_HOST: affine-redis
              # needs a manticoresearch/elasticsearch backend
              AFFINE_INDEXER_ENABLED: "false"
        containers:
          app:
            image: *image
            env: *env
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
      redis:
        containers:
          app:
            image:
              repository: docker.io/library/redis
              tag: 8.10.3
            # ponytail: cache and job queue only, no persistence
            args: ["--save", "", "--appendonly", "no"]
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 3010
      redis:
        controller: redis
        ports:
          redis:
            port: 6379
    ingress:
      main:
        className: external
        annotations:
          external-dns.alpha.kubernetes.io/hostname: doc.kaminek.me
          cert-manager.io/cluster-issuer: letsencrypt-production
          hajimari.io/enable: "true"
          hajimari.io/icon: notebook
          hajimari.io/group: Utilities
          hajimari.io/appName: AFFiNE
        hosts:
          - host: &host doc.kaminek.me
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - *host
            secretName: affine-tls
    persistence:
      data:
        existingClaim: affine-data
        advancedMounts:
          main:
            migrate: &data
              - path: /root/.affine
            app: *data
      # config.json holds the google oauth secret; signup is google-only, gated by the consent screen test users
      config:
        type: secret
        name: affine-secret
        advancedMounts:
          main:
            migrate: &config
              - path: /root/.affine/config/config.json
                subPath: config.json
                readOnly: true
            app: *config
