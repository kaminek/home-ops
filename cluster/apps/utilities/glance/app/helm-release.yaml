---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app glance
spec:
  releaseName: *app
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      glance:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: glanceapp/glance
              tag: v0.8.8
            env:
              TZ: Europe/Paris
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
    service:
      app:
        controller: glance
        ports:
          http:
            port: *port
    route:
      main:
        hostnames: ["glance.kaminek.me"]
        parentRefs:
          - name: external
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: http
            filters:
              - type: ExternalAuth
                externalAuth:
                  protocol: HTTP
                  backendRef:
                    name: oauth2-proxy
                    namespace: networking
                    port: 80
                  http:
                    allowedHeaders: ["Cookie"]
                    allowedResponseHeaders: ["X-Auth-Request-Email"]
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: Strict-Transport-Security
                      value: max-age=31449600; includeSubDomains
            timeouts:
              request: 0s # envoy default is 15s
    persistence:
      config:
        type: configMap
        name: glance-configmap
        globalMounts:
          - path: /app/config/glance.yml
            subPath: glance.yaml
            readOnly: true
