---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# the cilium chart has no HTTPRoute for hubble-ui
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
spec:
  hostnames: ["hubble.kaminek.me"]
  parentRefs:
    - name: external
      namespace: networking
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: oauth2-proxy
              namespace: networking
              port: 80
            http:
              allowedHeaders: ["Cookie"]
              allowedResponseHeaders: ["X-Auth-Request-Email"]
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31449600; includeSubDomains
      timeouts:
        request: 0s # envoy default is 15s
