---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.14.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: Skip
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: prometheus-operator-crds
      namespace: observability
  valuesFrom:
    - kind: ConfigMap
      name: ksm-helm-values
  values:
    crds:
      enabled: false
    cleanPrometheusOperatorObjectNames: true
    defaultRules:
      disabled:
        KubeCPUOvercommit: true
    alertmanager:
      ingress:
        enabled: true
        annotations:
          external-dns.alpha.kubernetes.io/hostname: alertmanager.kaminek.me
          cert-manager.io/cluster-issuer: letsencrypt-production
          nginx.ingress.kubernetes.io/auth-url: "https://oauth.kaminek.me/oauth2/auth"
          nginx.ingress.kubernetes.io/auth-signin: "https://oauth.kaminek.me/oauth2/start?rd=$scheme://$host$request_uri"
          hajimari.io/enable: "true"
          hajimari.io/icon: bell-alert
          hajimari.io/group: Monitoring
        ingressClassName: external
        hosts: ["alertmanager.kaminek.me"]
        tls:
          - secretName: alertmanager-tls
            hosts:
              - alertmanager.kaminek.me
        pathType: Prefix
      alertmanagerSpec:
        # chart default requests 200Mi, ~50Mi used
        resources:
          requests:
            memory: 64Mi
          limits:
            memory: 256Mi
        useExistingSecret: true
        configSecret: alertmanager-secret
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              resources:
                requests:
                  storage: 500Mi
    kubelet:
      enabled: true
      serviceMonitor:
        metricRelabelings:
          # Drop high cardinality labels
          - action: labeldrop
            regex: (uid)
          - action: labeldrop
            regex: (id|name)
          - action: drop
            sourceLabels: ["__name__"]
            regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
          # k3s runs every control-plane component in one process: /metrics on
          # the kubelet re-exports the apiserver/etcd series (~110k), already
          # scraped by the apiserver job
          - action: drop
            sourceLabels: ["__name__"]
            regex: (apiserver|etcd|watch_cache|aggregator|apiextensions|authentication|authorization|admission)_.*
        cAdvisorRelabelings:
          - action: replace
            sourceLabels: [__metrics_path__]
            targetLabel: metrics_path
    kubeApiServer:
      enabled: true
      serviceMonitor:
        metricRelabelings:
          # Drop high cardinality labels
          - action: drop
            sourceLabels: ["__name__"]
            regex: (apiserver|etcd|rest_client)_request(|_sli|_slo)_duration_seconds_bucket
          - action: drop
            sourceLabels: ["__name__"]
            regex: (apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket)
          # remaining apiserver/etcd histograms (~60k series), nothing here charts them
          - action: drop
            sourceLabels: ["__name__"]
            regex: (apiserver|etcd)_.+_bucket
    # k3s: scheduler and controller-manager endpoints serve the same process
    # metrics as the apiserver (~140k series each), pure duplicates
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: true
      endpoints:
        - 10.10.0.10
        - 10.10.0.11
        - 10.10.0.12
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    prometheus:
      ingress:
        enabled: true
        annotations:
          external-dns.alpha.kubernetes.io/hostname: prometheus.kaminek.me
          cert-manager.io/cluster-issuer: letsencrypt-production
          nginx.ingress.kubernetes.io/auth-url: "https://oauth.kaminek.me/oauth2/auth"
          nginx.ingress.kubernetes.io/auth-signin: "https://oauth.kaminek.me/oauth2/start?rd=$scheme://$host$request_uri"
          hajimari.io/enable: "true"
          hajimari.io/icon: database-search
          hajimari.io/group: Monitoring
        ingressClassName: external
        hosts: ["prometheus.kaminek.me"]
        pathType: Prefix
        tls:
          - secretName: prometheus-tls
            hosts:
              - prometheus.kaminek.me
      prometheusSpec:
        scrapeInterval: 30s # Must match interval in Grafana Helm chart
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        scrapeClasses:
          - name: add-cluster-label
            default: true
            # target label, not metric relabel: synthetic `up` needs it too,
            # KubeletDown joins on (cluster)
            relabelings:
              - action: replace
                targetLabel: cluster
                replacement: homelab
            metricRelabelings:
              # Preserve CNPG cluster label (renamed exported_cluster on conflict)
              - action: replace
                sourceLabels: [exported_cluster]
                targetLabel: cnpg_cluster
                regex: (.+)
              - action: labeldrop
                regex: exported_cluster
        enableAdminAPI: true
        walCompression: true
        enableFeatures:
          - auto-gomemlimit
          - memory-snapshot-on-shutdown
          - new-service-discovery-manager
        retention: 7d
        retentionSize: 25GB
        resources:
          requests:
            cpu: 100m
            # ~584k series needed 3Gi; k3s control-plane duplicates dropped
            # (kubelet relabel, scheduler/controller-manager off) -> ~130k.
            # frees node0 for a heavy runner
            memory: 1536Mi
          limits:
            memory: 1536Mi
        nodeSelector:
          kubernetes.io/hostname: node0-a55d689e
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              resources:
                requests:
                  storage: 30Gi
    nodeExporter:
      enabled: true
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      prometheus:
        monitor:
          enabled: true
          # relabelings:
          #   - action: replace
          #     regex: (.*)
          #     replacement: $1
          #     sourceLabels: ["__meta_kubernetes_pod_node_name"]
          #     targetLabel: kubernetes_node
    kubeStateMetrics:
      enabled: true
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      # metricLabelsAllowlist:
      #   - pods=[*]
      #   - deployments=[*]
      #   - persistentvolumeclaims=[*]
      prometheus:
        monitor:
          enabled: true
          # relabelings:
          #   - action: replace
          #     regex: (.*)
          #     replacement: $1
          #     sourceLabels: ["__meta_kubernetes_pod_node_name"]
          #     targetLabel: kubernetes_node
    grafana:
      enabled: false
