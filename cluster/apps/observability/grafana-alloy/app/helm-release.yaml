---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-alloy
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: k8s-monitoring
      version: 4.5.2
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: prometheus-operator-crds
      namespace: observability
  values:
    cluster:
      name: homelab

    # Destinations
    destinations:
      grafana-cloud-logs:
        type: loki
        url: https://logs-prod-008.grafana.net/loki/api/v1/push
        auth:
          type: basic
          usernameKey: grafana-loki-user
          passwordKey: grafana-loki-password
        secret:
          create: false
          name: grafana-credentials-secret
          namespace: observability
      grafana-cloud-traces:
        type: otlp
        url: https://tempo-prod-06-prod-gb-south-0.grafana.net/tempo
        auth:
          type: basic
          usernameKey: grafana-tempo-user
          passwordKey: grafana-tempo-password
        secret:
          create: false
          name: grafana-credentials-secret
          namespace: observability
        metrics:
          enabled: false
        logs:
          enabled: false
      internal-prometheus:
        type: prometheus
        url: http://prometheus-operated.observability.svc.cluster.local:9090/api/v1/write

    # Collectors
    collectors:
      alloy-logs:
        presets:
          - filesystem-log-reader
          - daemonset
      alloy-singleton:
        presets:
          - singleton
      alloy-receiver:
        presets:
          - deployment
        controller:
          type: deployment
          replicas: 1

    # Features
    podLogsViaLoki:
      enabled: true
      destinations:
        - grafana-cloud-logs
      extraStageBlocks: |-
        stage.limit {
          rate  = 500
          burst = 800
        }
      collector: alloy-logs

    nodeLogs:
      enabled: true
      destinations:
        - grafana-cloud-logs
      collector: alloy-logs

    clusterEvents:
      enabled: true
      destinations:
        - grafana-cloud-logs
      collector: alloy-singleton

    applicationObservability:
      enabled: true
      destinations:
        - grafana-cloud-logs
        - grafana-cloud-traces
        - internal-prometheus
      receivers:
        otlp:
          grpc:
            enabled: true
            port: 4317
          http:
            enabled: true
            port: 4318
      collector: alloy-receiver

    # Disabled
    clusterMetrics:
      enabled: false
    autoInstrumentation:
      enabled: false
    profiling:
      enabled: false
    kube-state-metrics:
      enabled: false
    prometheus-node-exporter:
      enabled: false
    prometheus-operator-crds:
      enabled: false
    opencost:
      enabled: false
